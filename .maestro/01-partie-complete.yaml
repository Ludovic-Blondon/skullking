# Parcours ① du plan (§9) : une partie complète de 10 manches, jusqu'au podium.
#
# Table de trois joueurs. À chaque manche, Alice remporte tous les plis et les
# deux autres annoncent 0 : la somme des plis tombe donc juste sans avoir à
# raisonner, et le décompte est vérifiable de tête.
#
#   maestro test .maestro/01-partie-complete.yaml
appId: com.lblondon.skullscores
---
- launchApp:
    clearState: true
# `clearState` efface aussi l'URL mémorisée par le client de développement :
# on la lui redonne pour qu'il se rebranche sur Metro.
- openLink: "com.lblondon.skullscores://expo-development-client/?url=http://localhost:8081"
- extendedWaitUntil:
    visible: "Nouvelle partie"
    timeout: 90000
# Le client de développement recharge son bundle une fois connecté à Metro :
# on laisse ce rechargement passer avant de toucher quoi que ce soit.
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "Nouvelle partie"
    timeout: 30000

# — Configuration : trois joueurs créés à la volée ————————————————————————
- tapOn:
    id: "new-game"
- tapOn:
    id: "new-player-name"
- inputText: "Alice"
- tapOn:
    id: "new-player-add"
- tapOn:
    id: "new-player-name"
- inputText: "Bob"
- tapOn:
    id: "new-player-add"
- tapOn:
    id: "new-player-name"
- inputText: "Chloe"
- tapOn:
    id: "new-player-add"
- assertVisible:
    id: "player-1"
- assertVisible:
    id: "player-2"
- assertVisible:
    id: "player-3"
- tapOn:
    id: "start-game"

# — Manche 1 : 1 carte(s) ————————————————————————————————————————
- assertVisible: "Manche 1 / 10"
- repeat:
    times: 1
    commands:
      - tapOn:
          id: "bid-1-plus"
- tapOn:
    id: "bid-2-minus"
- tapOn:
    id: "bid-3-minus"
- tapOn:
    id: "round-action"

- repeat:
    times: 1
    commands:
      - tapOn:
          id: "tricks-1-plus"
- tapOn:
    id: "tricks-2-minus"
- tapOn:
    id: "tricks-3-minus"
- tapOn:
    id: "round-action"

# — Manche 2 : 2 carte(s) ————————————————————————————————————————
- assertVisible: "Manche 2 / 10"
# Le cumul affiché ne doit compter que la manche 1 : Alice 20, Bob et Chloé 10.
# La manche 2 est ouverte mais vierge — la compter revenait à créditer la table
# d'une mise 0 réussie que personne n'a annoncée.
- assertVisible: "20 pts"
- assertVisible: "10 pts"
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "bid-1-plus"
- tapOn:
    id: "bid-2-minus"
- tapOn:
    id: "bid-3-minus"
- tapOn:
    id: "round-action"

- repeat:
    times: 2
    commands:
      - tapOn:
          id: "tricks-1-plus"
- tapOn:
    id: "tricks-2-minus"
- tapOn:
    id: "tricks-3-minus"
- tapOn:
    id: "round-action"

