# — Podium ————————————————————————————————————————————————————————————————
# Alice a réussi ses dix annonces : 20 × (1+2+…+10) = 1100 points.
# Bob et Chloé ont tenu leurs mises 0 : 10 × (1+2+…+10) = 550 points chacun.
- assertVisible: "Alice"
- assertVisible: "1100"
- assertVisible:
    id: "rematch"
